name: CI/CD Pipeline Avanzado

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Integración Continua (Linting, Tests & Compilación)
    runs-on: ubuntu-latest

    steps:
      - name: Descargar Código
        uses: actions/checkout@v4

      - name: Configurar Node.js (Versión LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar Dependencias
        run: npm ci

      - name: Validar Tipos y Sintaxis (TypeScript)
        run: npm run lint

      - name: Ejecutar Pruebas Unitarias Automatizadas
        run: npm run test

      - name: Compilar Aplicación para Producción
        run: npm run build
        env:
          NODE_ENV: production
